name: Aplikacja desktop (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zależności
        run: pip install -r requirements.txt pywebview pyinstaller pillow sounddevice soundfile
      - name: Test serwera (start, eksport, import)
        shell: python
        run: |
          import sys, os
          sys.path.insert(0, os.getcwd())
          import os, json, time, threading, base64, urllib.request
          os.environ.setdefault("ASYSTENT_DATA", "ci-data")
          import uvicorn, server
          srv = uvicorn.Server(uvicorn.Config(server.app, host="127.0.0.1", port=8799, log_config=None))
          threading.Thread(target=srv.run, daemon=True).start()
          while not srv.started: time.sleep(0.05)
          def call(path, body=None):
              req = urllib.request.Request("http://127.0.0.1:8799" + path, data=None if body is None else json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json"}, method="GET" if body is None and path == "/" else "POST")
              with urllib.request.urlopen(req) as r: return r.read()
          assert b"<html" in call("/").lower()
          call("/api/tasks", {"title": "Kolokwium", "date": "2026-10-05", "kind": "Kolokwium"})
          path = json.loads(call("/api/export", {}))["path"]
          r = json.loads(call("/api/import", {"filename": "k.zip", "data": base64.b64encode(open(path, "rb").read()).decode()}))
          assert r["ok"], r
          tasks = json.loads(urllib.request.urlopen("http://127.0.0.1:8799/api/tasks").read())
          assert [(t["title"], t["kind"]) for t in tasks] == [("Kolokwium", "Kolokwium")], tasks
          # nagrywanie: zapis OGG/Opus (libsndfile z pakietu) + PortAudio ładuje się na Windows
          import numpy, soundfile, sounddevice
          with soundfile.SoundFile("ci-test.ogg", "w", 16000, 1, format="OGG", subtype="OPUS") as f:
              f.write(numpy.zeros((16000, 1), dtype="int16"))
          assert abs(len(soundfile.read("ci-test.ogg")[0]) - 16000) < 400
          assert json.loads(urllib.request.urlopen("http://127.0.0.1:8799/api/rec").read()) == []
          print("smoke OK", path)
          srv.should_exit = True
      - name: Wersja (z tagu v1.2.3 albo z pliku VERSION)
        shell: python
        run: |
          import os, re
          ref = os.environ.get("GITHUB_REF", "")
          v = ref.split("/v", 1)[1] if ref.startswith("refs/tags/v") else open("VERSION").read().strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+", v), v
          open("VERSION", "w").write(v)
          open(os.environ["GITHUB_ENV"], "a").write(f"APP_VERSION={v}\n")
          os.makedirs("build", exist_ok=True)
          from PIL import Image
          Image.open("icon-512.png").save("build/logo.ico", sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          print("wersja", v)
      - name: Budowanie Asystent.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Asystent --icon build/logo.ico --add-data "index.html;." --add-data "logo.png;." --add-data "icon-192.png;." --add-data "icon-512.png;." --add-data "VERSION;." desktop.py
      - name: Instalator AsystentSetup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer\asystent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\AsystentSetup.exe | Format-List Name, Length
      - name: Czy wydać? (tag v* albo nowa wersja w pliku VERSION na main)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "DO_RELEASE=1" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "DO_RELEASE=1" >> $GITHUB_ENV; echo "Nowa wersja $APP_VERSION — tworzę wydanie"
          else echo "Wersja $APP_VERSION już wydana — tylko artefakt"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Asystent-windows
          path: |
            dist/AsystentSetup.exe
            dist/Asystent.exe
      - name: Wydanie na GitHubie
        if: env.DO_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Asystent ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            dist/AsystentSetup.exe
            dist/Asystent.exe
