# Serwer kont za istniejącym nginx (HTTPS i domena po stronie nginx).
# API słucha tylko lokalnie: 127.0.0.1:${PORT:-8100} — nginx: location /asystent/ → proxy_pass http://127.0.0.1:8100/
#   bash deploy.sh      (albo: docker compose up -d --build)
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-8100}:8100"
    volumes:
      - cloud-data:/data
volumes:
  cloud-data:
