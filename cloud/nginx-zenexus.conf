# zenexus.pl: strona z /var/www/zenexus + Asystent pod /asystent (serwer kont, strona pobierania, wersja webowa /asystent/app/)
# Stara domena zenfix.pl: wszystko przekierowane na zenexus.pl, poza API Asystenta — starsze wersje aplikacji
# (zanim się zaktualizują) dalej działają pod starym adresem. Po kilku tygodniach drugi blok można usunąć.
# Instalacja:
#   sudo cp nginx-zenexus.conf /etc/nginx/sites-available/zenexus
#   sudo ln -sf /etc/nginx/sites-available/zenexus /etc/nginx/sites-enabled/zenexus
#   sudo rm -f /etc/nginx/sites-enabled/zenfix          # stary plik — zastępuje go ten
#   sudo nginx -t && sudo systemctl reload nginx
# Certyfikat: Cloudflare (domena zenexus.pl) → SSL/TLS → Origin Server → Create certificate (zenexus.pl, *.zenexus.pl) →
#   zapisz jako /etc/ssl/cloudflare/zenexus.pem i /etc/ssl/cloudflare/zenexus.key; w Cloudflare tryb SSL „Full (strict)”.
#   Stary certyfikat /etc/ssl/cloudflare/zenfix.* zostaje dla przekierowań ze starej domeny.

# ======================== zenexus.pl ========================
server {
    listen 80;
    listen [::]:80;
    server_name zenexus.pl www.zenexus.pl;
    return 301 https://zenexus.pl$request_uri;
}

server {
    listen 443 ssl http2;          # starszy nginx (Ubuntu 22.04); na nowym zadziała z ostrzeżeniem
    listen [::]:443 ssl http2;
    server_name zenexus.pl www.zenexus.pl;

    ssl_certificate     /etc/ssl/cloudflare/zenexus.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zenexus.key;

    if ($host = www.zenexus.pl) { return 301 https://zenexus.pl$request_uri; }

    # główna strona
    root /var/www/zenexus;
    index index.html index.htm index.php;
    location / {
        try_files $uri $uri/ =404;
    }

    # Asystent (kontener Dockera na 127.0.0.1:8100)
    location = /asystent { return 301 /asystent/; }
    location /asystent/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 70m;
        proxy_read_timeout 180s;
    }
}

# ======================== zenfix.pl (stara domena) ========================
server {
    listen 80;
    listen [::]:80;
    server_name zenfix.pl www.zenfix.pl;
    return 301 https://zenexus.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zenfix.pl www.zenfix.pl;

    ssl_certificate     /etc/ssl/cloudflare/zenfix.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zenfix.key;

    # strona główna i strona pobierania → nowa domena
    location / { return 301 https://zenexus.pl$request_uri; }
    location = /asystent { return 301 https://zenexus.pl/asystent/; }
    location = /asystent/ { return 301 https://zenexus.pl/asystent/; }

    # API i wersja webowa Asystenta — bez przekierowania (przekierowanie gubi logowanie i wysyłane dane),
    # żeby stare wersje aplikacji działały do czasu aktualizacji
    location /asystent/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 70m;
        proxy_read_timeout 180s;
    }
}
