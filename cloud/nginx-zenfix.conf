# zenfix.pl: strona z /var/www/zenfix + Asystent pod /asystent (serwer kont, strona pobierania, wersja webowa /asystent/app/)
# Instalacja:
#   sudo cp nginx-zenfix.conf /etc/nginx/sites-available/zenfix
#   sudo ln -sf /etc/nginx/sites-available/zenfix /etc/nginx/sites-enabled/zenfix
#   sudo nginx -t && sudo systemctl reload nginx
# Certyfikat: Cloudflare → SSL/TLS → Origin Server → Create certificate (zenfix.pl, *.zenfix.pl) →
#   zapisz jako /etc/ssl/cloudflare/zenfix.pem i /etc/ssl/cloudflare/zenfix.key; w Cloudflare tryb SSL „Full (strict)”.

server {
    listen 80;
    listen [::]:80;
    server_name zenfix.pl www.zenfix.pl;
    return 301 https://zenfix.pl$request_uri;
}

server {
    listen 443 ssl http2;          # starszy nginx (Ubuntu 22.04); na nowym zadziała z ostrzeżeniem
    listen [::]:443 ssl http2;
    server_name zenfix.pl www.zenfix.pl;

    ssl_certificate     /etc/ssl/cloudflare/zenfix.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zenfix.key;

    if ($host = www.zenfix.pl) { return 301 https://zenfix.pl$request_uri; }

    # główna strona
    root /var/www/zenfix;
    index index.html index.htm index.php;
    location / {
        try_files $uri $uri/ =404;
    }

    # Asystent (kontener Dockera na 127.0.0.1:8100)
    location = /asystent { return 301 /asystent/; }
    location /asystent/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 70m;
        proxy_read_timeout 180s;
    }
}
