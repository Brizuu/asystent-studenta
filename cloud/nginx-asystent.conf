# Wklej do bloku  server { ... }  domeny bte-poland.pl (tego z listen 443 ssl), potem:
#   sudo nginx -t && sudo systemctl reload nginx
# Aplikacja łączy się z:  https://bte-poland.pl/asystent

location = /asystent { return 301 /asystent/; }

location /asystent/ {
    proxy_pass http://127.0.0.1:8100/;          # ukośnik na końcu: /asystent/auth/login → /auth/login
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;                   # avatary, udostępnione zeszyty, synchronizacja
    proxy_read_timeout 120s;
}
