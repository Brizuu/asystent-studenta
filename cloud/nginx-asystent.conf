# Wklej do bloku  server { ... }  domeny (np. zenfix.pl) (tego z listen 443 ssl), potem:
#   sudo nginx -t && sudo systemctl reload nginx
# Aplikacja łączy się z:  https://zenfix.pl/asystent

location = /asystent { return 301 /asystent/; }

location /asystent/ {
    proxy_pass http://127.0.0.1:8100/;          # ukośnik na końcu: /asystent/auth/login → /auth/login
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;   # prawdziwe IP za Cloudflare (limit prób logowania)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 70m;                   # PDF-y (do 60 MB), avatary, udostępnione zeszyty, synchronizacja
    proxy_read_timeout 120s;
}
